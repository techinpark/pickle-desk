name: Daily stats
on:
  schedule:
    - cron: '0 0 * * *' # 매일 오전 9시(KST)
  workflow_dispatch:

jobs:
  report:
    # 포크에서는 돌지 않는다(비밀값이 없다).
    if: github.repository == 'techinpark/pickle-desk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tool/daily_stats.mjs
        env:
          GA_SA_KEY: ${{ secrets.GA_SA_KEY }}
          GA_PROPERTY_ID: ${{ vars.GA_PROPERTY_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
